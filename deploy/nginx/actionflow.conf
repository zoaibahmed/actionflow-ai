# Replace actionflow.example.com and certificate paths. Included in http {}.
log_format actionflow_safe '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';
server {
 listen 80;
 server_name actionflow.example.com;
 access_log /var/log/nginx/actionflow-access.log actionflow_safe;
 error_log /var/log/nginx/actionflow-error.log warn;
 location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
 location / { return 301 https://actionflow.example.com$request_uri; }
}
server {
 listen 443 ssl;
 server_name actionflow.example.com;
 ssl_certificate /etc/letsencrypt/live/actionflow.example.com/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/actionflow.example.com/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 server_tokens off;
 if ($host != actionflow.example.com) { return 444; }
 access_log /var/log/nginx/actionflow-access.log actionflow_safe;
 error_log /var/log/nginx/actionflow-error.log warn;
 add_header Strict-Transport-Security "max-age=31536000" always;
 client_max_body_size 12m;
 client_body_timeout 20s;
 client_header_timeout 15s;
 keepalive_timeout 30s;
 location ^~ /api/reminders/worker { return 404; }
 location / {
  proxy_pass http://127.0.0.1:3000;
  proxy_http_version 1.1;
  proxy_set_header Host actionflow.example.com;
  proxy_set_header X-Forwarded-Host actionflow.example.com;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Actionflow-Client-IP $remote_addr;
  proxy_set_header Forwarded "";
  proxy_set_header Connection "";
  proxy_connect_timeout 5s;
  proxy_send_timeout 90s;
  proxy_read_timeout 120s;
  proxy_buffering off;
  proxy_request_buffering off;
  proxy_max_temp_file_size 0;
 }
}
